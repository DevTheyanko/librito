  <script>
    const DEFAULT_TEXT = `3.3 Identifica etiquetado o simbología de seguridad y de diferentes servicios que posee la aeronave:
Simbología y avisos: Calcomanías de advertencia de peligro (radioactividad en equipos de radar, zonas calientes de escape, áreas de peligro de hélices o turbinas).

Etiquetado de servicios: Puntos de llenado de combustible (tipo de octanaje o Jet-A), puntos de recarga de aceite, tomas estáticas y de presión total (Pitot con fundas de "Remove Before Flight"), conexiones de oxígeno, paneles de descarga de estática a tierra, fluidos hidráulicos y conexiones eléctricas terrestres.

3.4 Identifica los diferentes materiales de fabricación de las aeronaves
Aleaciones de aluminio: (Ej. series 2024 y 7075) ampliamente usadas en revestimientos, costillas y largueros por su excelente relación resistencia-peso.

Aceros aleados y inoxidables: Usados en bancadas de motor, trenes de aterrizaje, pernos de alta resistencia y componentes sometidos a grandes esfuerzos térmicos o mecánicos.

Materiales compuestos (Composites): Fibras de vidrio, aramida (Kevlar) y fibra de carbono con matrices resinosas, empleados en carenados, superficies de control y estructuras secundarias o primarias modernas.

Otros: Aleaciones de titanio (escapes y mamparos antifuego) y maderas/telas en aeronaves clásicas o de entrenamiento elemental.

3.5 Identifica daños estructurales y su clasificación
Tipos de daños: Abolladuras, grietas, corrosión, deformaciones permanentes, delaminaciones en materiales compuestos y perforaciones o cortes.

Clasificación de daños:
- Daño permitido: Aquel que no compromete la seguridad, se puede monitorear sin reparación inmediata.
- Daño reparable: Aquel que supera los límites de tolerancia y que requiere reparación mediante parches, reemplazo de remaches, o refuerzos según el manual.
- Daño no reparable: Aquel cuya magnitud compromete de manera crítica la integridad estructural y obliga a cambiar la pieza o componente por completo.

3.6 Identifica la presencia de corrosión y los posibles daños que pudiera ocasionar
Tipos principales de corrosión y sus ejemplos:

1. Corrosión Superficial (Surface Corrosion):
- Qué es: Es la forma más leve, afecta únicamente la capa exterior del metal.
- Ejemplo: Una mancha blanca, grisácea o un ligero abombamiento de la pintura en el revestimiento de aluminio de un ala o fuselaje debido a la exposición prolongada a la humedad ambiental.
- Daño que ocasiona: Si se trata a tiempo (removiendo mecánicamente y aplicando convertidores/primarios protectores), no causa daños estructurales significativos; si se ignora, evoluciona a picaduras profundas.

2. Corrosión por Picaduras (Pitting Corrosion):
- Qué es: Es el ataque localizado que perfora el metal hacia adentro, formando pequeños agujeros o cavidades (pits).
- Ejemplo: Se presenta comúnmente en superficies de aluminio sin pintar o donde la capa protectora de anodizado se ha rayado, acumulando gotas de agua con sal.
- Daño que ocasiona: Crea "concentradores de esfuerzos" (puntos donde se concentra la fuerza estructural), debilitando la pieza y pudiendo generar microfisuras por fatiga bajo cargas de vuelo.

3. Corrosión Galvánica (Galvanic Corrosion):
- Qué es: Ocurre cuando dos metales con diferente potencial eléctrico entran en contacto directo en presencia de un electrolito (como agua con sal).
- Ejemplo: Una zona donde se instaló un tornillo de acero inoxidable directamente sobre una estructura de aleación de aluminio sin usar una pasta selladora aislante (Duralac) o una arandela de protección.
- Daño que ocasiona: El metal menos noble (en este caso el aluminio) se sacrifica y se corroe rápidamente de forma severa alrededor del perno, provocando holguras en los orificios y pérdida total de sujeción.

4. Corrosión Intergranular y Exfoliación (Intergranular & Exfoliation):
- Qué es: Es un ataque invisible que ocurre a lo largo de los límites de los granos del metal (muy común en aleaciones de aluminio de alta resistencia como la serie 7075). La exfoliación es una etapa avanzada donde la corrosión empuja las capas del metal hacia afuera.
- Ejemplo: Se observa a veces en los perfiles estructurales internos o largueros expuestos a humedad retenida en las zonas inferiores del fuselaje (bilge areas).
- Daño que ocasiona: Las piezas se abren como "hojas de libro" (de ahí el nombre de exfoliación), destruyendo por completo las propiedades mecánicas y estructurales del material, requiriendo su reemplazo inmediato.

3.7 Herramientas básicas o comunes
Herramientas: Llaves fijas y de corona, juegos de dados (sockets), torquímetros (llaves dinamométricas calibradas), alicates, destornilladores, martillos de cabeza blanda y de golpe seco (dead blow), extractores mecánicos y punzones.

3.8 Identifica y emplea herramientas especiales de medición y de precisión
Medición: Vernier, galgas de espesores, tensiómetros de guallas.
Torque: Torquímetro y multiplicador de torque.

3.9 Fugas de aceite, lubricantes, combustible y sus márgenes de tolerancia
Clasificación estándar de fugas:
- Humedad/SUD (Seepage): Mancha superficial sin formar gota activa (generalmente dentro de tolerancia).
- Goteo lento (Drip): Formación de gotas que caen a intervalos regulares.
- Fuga activa (Running leak): Flujo continuo de fluido (normalmente requiere acción correctiva inmediata No-Go).
Criterios: Consultar siempre el Manual de Mantenimiento de la Aeronave (AMM/MEL); sistemas críticos (como oxígeno o ciertas líneas de combustible/hidráulico) tienen tolerancia cero.

3.10 Puntos para pesaje de la aeronave y medidas de seguridad
Localización: Puntos específicos de apoyo bajo el fuselaje o las alas indicados en el Manual de Pesaje y Centraje (Weight and Balance Manual), donde se colocan celdas de carga (load cells) o balanzas de plataforma.

Medidas de seguridad:
- Nivelar la aeronave en un hangar cerrado (sin corrientes de aire).
- Drenar combustible hasta el nivel no utilizable (según especificaciones del manual).
- Asegurar que no haya personal a bordo y retirar herramientas u objetos sueltos.

3.11 Medios de protección y de seguridad a emplear sobre las aeronaves parqueadas
- Fundas y coberturas para tubos Pitot y tomas estáticas.
- Tapones/cobertores de entradas y salidas de motores y tomas de aire.
- Seguros mecánicos/Pines de bloqueo para el tren de aterrizaje y superficies de control.
- Calzas en las ruedas y cables de puesta a tierra (cable de masa estática).
- Amarre adicional: Cuerdas o cables de anclaje a los puntos fijos de la plataforma en caso de condiciones de vientos fuertes o huracanados.

3.12 Identifica la selección de combustible correspondiente para las aeronaves, medidas de seguridad para el abastecimiento, drenaje y chequeo por contaminación
Tipos de combustible:
- AVGAS (100LL): Para motores de pistón (color azul).
- JET A-1 / JET A: Para motores a reacción y turbopropulsores (color paja/transparente).

Procedimientos:
- Abastecimiento: Puesta a tierra obligatoria entre camión, aeronave y boquilla para evitar chispas estáticas.
- Drenaje y chequeo: Tomar muestras en los puntos bajos de los tanques usando vasos probadores para verificar ausencia de agua (separación de fases/prueba química), partículas o microorganismos.

3.13 Remaches convencionales y especiales para estructuras metálicas
- Remaches convencionales (sólidos): Cabeza avellanada (AN426) y cabeza redonda/universal (AN470). Se instalan usando martillo neumático y contraestampe.
- Remaches especiales (ciegos/estructurales): CherryMAX, Huckbolts, Hi-Lok. Se emplean en áreas de acceso restringido por un solo lado o donde se requieran tolerancias de alta resistencia.
Selección: Según el material de la estructura a unir, respetando el diámetro y longitud correctos en función del espesor de las chapas.

3.14 Identifica, desmonta e instala instrumentos en tablero de la cabina de pilotos
Identificación: Instrumentos de vuelo (altímetro, indicador de velocidad, horizonte artificial), de motor (tacómetro, temperatura de aceite, presión) y de navegación.

Procedimiento de desmontaje e instalación:
1. Desconectar la alimentación eléctrica principal y aplicar el procedimiento de Tag-out/Lockout.
2. Retirar los tornillos de fijación del panel/instrumento.
3. Desconectar arneses eléctricos, líneas de presión/vacío o conexiones Pitot-estáticas identificando cada cable/manguera.
4. Para la instalación, verificar calibración previa, conectar líneas/arneses, ajustar tornillos al torque especificado y realizar prueba funcional y de hermeticidad (leak test).

3.15 Equipos de comunicación y navegación de la aeronave
Comunicación: Transceptores VHF/HF de comunicación y sistema de intercomunicación de cabina (Audio Panel).
Navegación: VOR, ILS, DME, GPS/GNSS, ADF y Transponder (SSR/ADS-B).

3.16 Componentes del sistema hidráulico
- Reservorio/Depósito de fluido.
- Bombas hidráulicas (accionadas por motor o eléctricas).
- Actuadores y cilindros hidráulicos.
- Válvulas de control (de alivio, selectoras y de retención).
- Acumuladores, filtros y tuberías/mangueras de alta presión.

3.17 Componentes del sistema de combustible
- Tanques de combustible (estructurales/móviles).
- Bombas de combustible (sumergidas/mecánicas/de transferencia).
- Filtros de combustible y separadores de agua.
- Válvulas de corte (shut-off), selectoras y de drenaje.
- Indicadores de cantidad (fuel quantity indicators) y flujo.

3.18 Componentes del sistema de tren de aterrizaje
- Amortiguadores oleoneumáticos (puntales o struts).
- Conjuntos de ruedas y neumáticos, sistema de frenos (discos, mordazas/calipers y líneas hidráulicas).
- Puertas del tren.
- Sistema de retracción (actuadores y ganchos de traba mecánica en posición arriba/abajo).
- Sistema de emergencia para extensión del tren.
- Sistema de dirección de la rueda de nariz.

3.19 Componentes del sistema eléctrico
Fuentes de energía: Baterías (níquel-cadmio o plomo-ácido), alternadores o generadores acoplados al motor y unidad de potencia auxiliar (APU).
Distribución y protección: Unidad de control de generación (GCU), barras distribuidoras, interruptores termomagnéticos (circuit breakers - CBs), cableado, relés, contactores y disyuntores.
Conversión: Inversores y transformadores o rectificadores.

3.20 Componentes del sistema moto propulsor (motor y hélice)
Motor Recíproco / Pistón:
- Cárter: Estructura central que aloja el cigüeñal y soporta los cilindros.
- Cilindros: Donde ocurre la combustión; poseen aletas para disipar el calor y albergan válvulas y bujías.
- Sistema de Encendido: Totalmente autónomo de la batería, compuesto por dos magnetos independientes (izquierdo y derecho) y doble bujía por cilindro por seguridad.
- Sistema de Inducción/Combustible: Mezcla el aire y combustible (mediante carburador o inyección) antes de enviarlo a los cilindros.

Motor de Turbina (Turbohélice):
- Compresor: Aspira y comprime el aire ambiente a alta presión.
- Cámara de Combustión: Quema el combustible mezclado con el aire comprimido para generar gases de alta energía.
- Turbina y Caja Reductora: Los gases mueven las turbinas que accionan el compresor y reducen las RPM para mover el eje de la hélice.

Sistema de la Hélice:
- Palas y Cubo: Superficies aerodinámicas fijadas al núcleo que generan la tracción (thrust) al girar.
- Gobernador de Hélice: Dispositivo hidráulico-mecánico que ajusta automáticamente el ángulo de las palas mediante presión de aceite para mantener las RPM constantes.
- Sistemas Especiales: Paso de Bandera (Feathering) para minimizar resistencia en falla y Reversa para frenado.

3.21 Método de Pruebas No Destructivas (NDT)
Métodos principales:
- Inspección Visual: Uso de boroscopios y lupas.
- Líquidos penetrantes (PT): Para detectar grietas abiertas a la superficie en materiales no porosos (aluminios, aceros).
- Partículas magnéticas (MT): Para detectar defectos superficiales y subsuperficiales en materiales ferromagnéticos (aceros).
- Corrientes Eddy / Inducidas (ET): Para inspección de grietas superficiales y detección de corrosión oculta sin remover capas de pintura.
- Ultrasonido (UT) y Radiografía (RT): Para inspección interna de estructuras y materiales compuestos buscando delaminaciones o fallas internas.`;

    let currentPage = 0;
    let pages = [];
    let toc = [];
    let searchQuery = '';

    const contentArea = document.getElementById('content-area');
    const pageNumEl = document.getElementById('page-num');
    const sectionTitleEl = document.getElementById('section-title');
    const pageIndicator = document.getElementById('page-indicator');
    const pageSlider = document.getElementById('page-slider');
    const sliderMaxText = document.getElementById('slider-max-text');
    const totalWordsEl = document.getElementById('total-words');

    const btnPrev = document.getElementById('btn-prev-page');
    const btnNext = document.getElementById('btn-next-page');

    window.addEventListener('DOMContentLoaded', () => {
      processText(DEFAULT_TEXT);
      setupEvents();
    });

    function processText(rawText) {
      const words = rawText.trim().split(/\s+/).filter(Boolean).length;
      totalWordsEl.textContent = `${words.toLocaleString()} palabras`;

      toc = [];
      pages = [];
      const lines = rawText.split('\n');
      
      let currentTitle = "Generalidades";
      let currentHTML = "";

      lines.forEach(line => {
        const trimmed = line.trim();
        if (/^(?:\d+\.\d+|\d+\.)\s+/.test(trimmed)) {
          if (currentHTML.trim().length > 0) {
            pages.push({ title: currentTitle, html: currentHTML });
          }
          currentTitle = trimmed;
          toc.push({ title: currentTitle, pageIndex: pages.length });
          currentHTML = `<h2 class="text-sm sm:text-base font-bold text-amber-800 mb-3 border-b border-stone-300 pb-1">${trimmed}</h2>`;
        } else if (trimmed.length > 0) {
          if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
            currentHTML += `<li class="ml-4 mb-2 text-xs sm:text-sm list-disc">${formatText(trimmed.substring(2))}</li>`;
          } else {
            currentHTML += `<p class="mb-3 text-xs sm:text-sm leading-relaxed">${formatText(trimmed)}</p>`;
          }
        }
      });

      if (currentHTML.trim().length > 0) {
        pages.push({ title: currentTitle, html: currentHTML });
      }

      pageSlider.max = pages.length;
      sliderMaxText.textContent = pages.length;
      currentPage = 0;
      renderCurrentPage();
      buildTOC();
    }

    function formatText(str) {
      return str.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<strong>$1</strong>');
    }

    function renderCurrentPage() {
      if (pages.length === 0) return;

      const page = pages[currentPage];
      let html = page.html;

      if (searchQuery.trim().length > 2) {
        const regex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        html = html.replace(regex, '<mark class="highlight-search">$1</mark>');
      }

      contentArea.innerHTML = html;
      pageNumEl.textContent = `Pág. ${currentPage + 1}`;
      sectionTitleEl.textContent = page.title;
      pageIndicator.textContent = `Página ${currentPage + 1} de ${pages.length}`;
      pageSlider.value = currentPage + 1;

      btnPrev.disabled = currentPage === 0;
      btnPrev.style.opacity = currentPage === 0 ? "0.3" : "1";

      btnNext.disabled = currentPage === pages.length - 1;
      btnNext.style.opacity = currentPage === pages.length - 1 ? "0.3" : "1";
    }

    function buildTOC() {
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';
      toc.forEach(item => {
        const div = document.createElement('div');
        div.className = 'py-2 px-1 hover:bg-stone-800 rounded cursor-pointer text-stone-300 hover:text-amber-400 truncate';
        div.textContent = item.title;
        div.onclick = () => {
          currentPage = item.pageIndex;
          renderCurrentPage();
          document.getElementById('modal-toc').classList.add('hidden');
        };
        tocList.appendChild(div);
      });
    }

    function setupEvents() {
      btnPrev.onclick = () => { if (currentPage > 0) { currentPage--; renderCurrentPage(); } };
      btnNext.onclick = () => { if (currentPage < pages.length - 1) { currentPage++; renderCurrentPage(); } };

      pageSlider.oninput = (e) => {
        currentPage = parseInt(e.target.value) - 1;
        renderCurrentPage();
      };

      document.getElementById('btn-toc').onclick = () => document.getElementById('modal-toc').classList.remove('hidden');
      document.getElementById('btn-close-toc').onclick = () => document.getElementById('modal-toc').classList.add('hidden');

      document.getElementById('btn-open-modal').onclick = () => {
        document.getElementById('input-text-area').value = DEFAULT_TEXT;
        document.getElementById('modal-text').classList.remove('hidden');
      };
      document.getElementById('btn-close-modal').onclick = () => document.getElementById('modal-text').classList.add('hidden');
      document.getElementById('btn-cancel-text').onclick = () => document.getElementById('modal-text').classList.add('hidden');
      document.getElementById('btn-load-default').onclick = () => document.getElementById('input-text-area').value = DEFAULT_TEXT;

      document.getElementById('btn-process-text').onclick = () => {
        const txt = document.getElementById('input-text-area').value;
        if (txt.trim()) {
          processText(txt);
          document.getElementById('modal-text').classList.add('hidden');
        }
      };

      document.getElementById('btn-search-toggle').onclick = () => {
        const bar = document.getElementById('search-bar');
        bar.classList.toggle('hidden');
      };

      document.getElementById('search-input').oninput = (e) => {
        searchQuery = e.target.value;
        renderCurrentPage();
      };
    }
  </script>
</body>
</html>
